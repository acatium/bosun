name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Model (LinkML validation and reference checks)
        run: python -m backplane validate
      - name: Generated classes match the schema
        run: |
          { echo "# Generated from model/bosun.yaml by gen-pydantic. Do not edit; regenerate with: model/.venv/bin/gen-pydantic model/bosun.yaml"; gen-pydantic model/bosun.yaml; } > /tmp/generated.py
          diff -u backplane/generated.py /tmp/generated.py
      - name: Tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Portability (no environment-specific identifiers in tracked files)
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TENANT_DOMAIN: ${{ vars.TENANT_DOMAIN }}
          SHAREPOINT_HOST: ${{ vars.SHAREPOINT_HOST }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: python tools/check_portability.py
      - name: Deny-list scan (files and full history)
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: python tools/check_denylist.py
