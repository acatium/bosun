name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.2
      - name: Firm profile, infrastructure and bootstrap allowlists
        env:
          FIRM_PROFILE: ${{ vars.FIRM_PROFILE }}
        run: python tools/check_guardrails.py
      - name: Portability (no environment-specific identifiers in tracked files)
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: python tools/check_portability.py
      - name: Deny-list scan (files and full history)
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: python tools/check_denylist.py

  what-if:
    needs: guardrails
    if: github.event_name == 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview infrastructure changes
        run: >
          az deployment group what-if
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --template-file infra/main.bicep
          --parameters prefix="${{ vars.FIRM_PREFIX }}"
