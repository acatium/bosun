# Contoso Capital business glossary: the closed set of terms agents may use for portfolio figures.
# Each term binds to exactly one measure in the Fabric semantic model "Contoso Portfolio".
# Owner: ops-lead (Finance & Operations), per config/profiles/contoso.yaml.

terms:
  - term: Revenue
    measure: Revenue
    definition: Recognised revenue for the period, in USD thousands. Actual scenario unless stated.
  - term: Plan revenue
    measure: Plan Revenue
    definition: Revenue in the value creation plan (scenario = Plan) for the same period.
  - term: EBITDA
    measure: EBITDA
    definition: Earnings before interest, tax, depreciation and amortisation, in USD thousands. Actual scenario.
  - term: Plan EBITDA
    measure: Plan EBITDA
    definition: EBITDA in the value creation plan for the same period.
  - term: EBITDA variance to plan
    measure: EBITDA vs Plan %
    definition: (EBITDA - Plan EBITDA) / Plan EBITDA. Negative means behind plan.
  - term: EBITDA margin
    measure: EBITDA Margin %
    definition: EBITDA / Revenue, Actual scenario.
  - term: LTM EBITDA
    measure: LTM EBITDA
    definition: Sum of Actual EBITDA over the twelve months ending with the latest month in context, in USD thousands.
  - term: Net debt
    measure: Net Debt
    definition: Net debt at the latest month in context, in USD millions. Actual scenario.
  - term: Leverage
    measure: Leverage x
    definition: Net debt / LTM EBITDA, expressed as a multiple. The covenant-style ratio partners track.
  - term: Value creation initiative
    measure: Initiative Target Uplift
    definition: A named lever in a company's value creation plan with a target annual EBITDA uplift, owner and status.
