# Store registry: one entry per keyed store and its store agent. The gateway exposes one tool per store.
# Adding a store (for example a deal room) is a change to this file, reviewed like any other.
# Identifiers are environment-specific, so they come from environment variables, never from this file.

stores:
  - key: contoso-portfolio
    name: Contoso Portfolio
    domain: finance-operations
    access_group: contoso-portfolio-readers
    description: >-
      Portfolio company performance against the value creation plan: revenue, EBITDA, margin, LTM EBITDA,
      net debt, leverage and value creation initiatives, from the governed semantic model.
    agent:
      kind: fabric-data-agent
      workspace_id_env: BOSUN_FABRIC_WORKSPACE_ID
      agent_id_env: BOSUN_DATA_AGENT_ID
