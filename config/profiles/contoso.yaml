# Contoso Capital: the example firm profile, a fictional alternative investment firm.
# A firm profile holds the org primitives (domains, personas, owners) as data. They are checked in CI
# and applied to Entra ID by the pipeline. To port this platform, add config/profiles/<your-firm>.yaml.

firm:
  name: Contoso Capital
  prefix: contoso

domains:
  - key: private-equity
    name: Private Equity
    owner: pe-partner
    description: Sourcing, due diligence and portfolio ownership of private companies.
  - key: finance-operations
    name: Finance & Operations
    owner: ops-lead
    description: Fund accounting, reporting and the firm's authoritative figures.
  - key: technology
    name: Technology
    owner: platform-owner
    description: The AI platform, identity and infrastructure.

personas:
  - key: pe-partner
    name: Private Equity Partner
    domain: private-equity
  - key: pe-associate
    name: Private Equity Associate
    domain: private-equity
  - key: ops-lead
    name: Finance & Operations Lead
    domain: finance-operations
  - key: platform-owner
    name: Platform Owner
    domain: technology
