# Deterministic rules enforced in CI. Changing this file requires owner review (see CODEOWNERS).
# These rules are firm-agnostic; firm-specific values live in config/profiles/ and .env.

# Prefix rules: short enough to fit Azure's 24-character storage account name limit.
prefix_pattern: '^[a-z][a-z0-9]{1,8}$'

# Only these Azure resource types may be declared in infra/. Adding one is a reviewed decision.
allowed_azure_resource_types:
  - Microsoft.OperationalInsights/workspaces
  - Microsoft.Storage/storageAccounts
  - Microsoft.Storage/storageAccounts/tableServices
  - Microsoft.Storage/storageAccounts/tableServices/tables

# Microsoft Graph application permissions the deploy identity may hold.
# bootstrap/bootstrap.ps1 must request nothing outside this list.
allowed_graph_application_permissions:
  - Group.Create
  - Application.ReadWrite.OwnedBy

# Every Bicep file must tag its resources with these keys.
required_tags:
  - managedBy
  - domain
